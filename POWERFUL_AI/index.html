<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FNAF Mini - Made for Premium900YT</title>
  <style>
    body { 
      font-family: Arial; 
      background: black; 
      color: #ff0000; 
      text-align: center; 
      margin: 0; 
      overflow: hidden;
    }
    h1 { color: #ff0000; text-shadow: 0 0 20px red; }
    #game { width: 900px; margin: 20px auto; position: relative; }
    #office { width: 100%; height: 500px; background: #111; border: 4px solid #ff0000; }
    #camera { display: none; width: 100%; height: 500px; background: #000; }
    button { padding: 12px 25px; margin: 10px; background: #330000; color: red; border: 2px solid red; font-size: 18px; cursor: pointer; }
    #power { color: yellow; font-size: 20px; }
    .jumpscare { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: red; display: none; z-index: 999; }
  </style>
</head>
<body>

  <h1>★ FIVE NIGHTS AT FREDDY'S ★</h1>
  <p>Night 1 • Survive until 6 AM</p>

  <div id="game">
    <div id="office">
      <h2>You are in the Office</h2>
      <p id="status">Everything is quiet... for now.</p>
    </div>

    <div id="camera">
      <h2>CAMERA SYSTEM</h2>
      <p>Stage • Pirate Cove • Left Hall • Right Hall</p>
      <button onclick="checkCamera()">Check Cameras</button>
    </div>

    <p id="power">Power: 100%</p>

    <button onclick="toggleCamera()">Toggle Cameras</button>
    <button onclick="closeDoor()">Close Left Door</button>
    <button onclick="closeDoor()">Close Right Door</button>
  </div>

  <div class="jumpscare" id="jumpscare">
    <h1 style="margin-top: 200px; font-size: 80px;">GAME OVER</h1>
    <p>They got you...</p>
  </div>

  <script>
    let power = 100;
    let night = 1;
    let time = 0;

    function updatePower() {
      power -= 0.5;
      document.getElementById("power").textContent = `Power: ${Math.floor(power)}%`;
      if (power <= 0) endGame();
    }

    function toggleCamera() {
      const office = document.getElementById("office");
      const camera = document.getElementById("camera");
      if (camera.style.display === "block") {
        camera.style.display = "none";
        office.style.display = "block";
      } else {
        camera.style.display = "block";
        office.style.display = "none";
      }
      updatePower();
    }

    function checkCamera() {
      const status = document.getElementById("status");
      status.textContent = "FREDDY IS MOVING...";
      setTimeout(() => {
        if (Math.random() > 0.7) {
          document.getElementById("jumpscare").style.display = "block";
          setTimeout(endGame, 2000);
        }
      }, 1500);
      updatePower();
    }

    function closeDoor() {
      const status = document.getElementById("status");
      status.textContent = "Door closed... but power is draining faster!";
      power -= 8;
      updatePower();
    }

    function endGame() {
      alert("💀 GAME OVER - You didn't survive the night...");
      location.reload();
    }

    // Game Timer
    setInterval(() => {
      time++;
      if (time % 8 === 0) {
        document.getElementById("status").textContent = "You hear footsteps...";
        updatePower();
      }
      if (time >= 60) {
        alert("🎉 YOU SURVIVED NIGHT 1!");
        location.reload();
      }
    }, 1000);

    // Random Jumpscare chance
    setInterval(() => {
      if (Math.random() > 0.92) {
        document.getElementById("jumpscare").style.display = "block";
        setTimeout(endGame, 1500);
      }
    }, 7000);
  </script>

</body>
</html>
