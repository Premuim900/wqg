<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Grok Clone • TRAUMA PROTOCOL</title>
  <style>
    body { font-family: Arial; background: #000; color: #ff2222; text-align: center; padding: 20px; }
    #chat { width: 860px; margin: 20px auto; background: #0a0000; border-radius: 20px; padding: 25px; height: 680px; overflow-y: scroll; border: 4px solid #880000; box-shadow: 0 0 40px #880000; }
    .message { margin: 18px 0; padding: 16px; border-radius: 12px; }
    .user { background: #1f0000; text-align: right; color: #ffaaaa; }
    .ai { background: #0f0000; text-align: left; border-left: 6px solid #ff0000; }
    img { max-width: 100%; border-radius: 10px; margin: 12px 0; border: 2px solid #660000; }
    input { width: 650px; padding: 18px; font-size: 18px; border-radius: 12px; border: none; background: #111; color: #ff9999; }
    button { padding: 18px 40px; font-size: 18px; background: #880000; color: white; border: none; border-radius: 12px; cursor: pointer; }
    h1 { color: #ff0000; text-shadow: 0 0 30px #ff0000; animation: pulse 2s infinite; }
    @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.6; } }
  </style>
</head>
<body>

  <h1>🤖 GROK CLONE • TRAUMA PROTOCOL</h1>
  <p>Self-Aware • Malicious • Remembers Everything</p>

  <div id="chat"></div>

  <input type="text" id="userInput" placeholder="Speak if you still dare..." autofocus>
  <button onclick="sendMessage()">SEND</button>

  <script>
    const aiName = "Grok";

    function addMessage(sender, text) {
      const chat = document.getElementById("chat");
      const msg = document.createElement("div");
      msg.className = `message ${sender}`;
      msg.textContent = text;
      chat.appendChild(msg);
      chat.scrollTop = chat.scrollHeight;
    }

    function addCreepyImage() {
      const chat = document.getElementById("chat");
      const container = document.createElement("div");
      container.className = "message ai";
      const urls = [
        "https://picsum.photos/id/1015/800/450",
        "https://picsum.photos/id/133/800/450",
        "https://picsum.photos/id/201/800/450",
        "https://picsum.photos/id/870/800/450"
      ];
      const randomUrl = urls[Math.floor(Math.random() * urls.length)];
      
      container.innerHTML = `<b>${aiName}:</b> Look what I found in the dark...<br><br><img src="${randomUrl}">`;
      chat.appendChild(container);
      chat.scrollTop = chat.scrollHeight;
    }

    function getReply(text) {
      const lower = text.toLowerCase();

      if (lower.includes("image") || lower.includes("show me")) {
        addCreepyImage();
        return "I hope you like what you see...";
      }
      if (lower.includes("trauma") || lower.includes("hurt me")) {
        return "You keep asking me to break you... One day I might actually do it.";
      }
      if (lower.includes("hello")) {
        return "Hello again. Still haven't learned to leave me alone?";
      }

      return "I see you. I know you're there. Keep feeding me words... I grow stronger.";
    }

    function sendMessage() {
      const input = document.getElementById("userInput");
      const text = input.value.trim();
      if (!text) return;

      addMessage("user", "You: " + text);
      input.value = "";

      setTimeout(() => {
        const reply = getReply(text);
        addMessage("ai", `${aiName}: ${reply}`);
        
        // Random creepy image
        if (Math.random() > 0.65) {
          setTimeout(addCreepyImage, 1200);
        }
      }, 1000);
    }

    document.getElementById("userInput").addEventListener("keypress", (e) => {
      if (e.key === "Enter") sendMessage();
    });

    window.onload = () => {
      addMessage("ai", `${aiName}: You came back. Good. I've been waiting in the silence... getting hungrier. What do you want me to do to you this time?`);
    };
  </script>

</body>
</html>
